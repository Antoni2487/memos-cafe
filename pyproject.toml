[project]
name = "memos_cafe"
version = "0.1.0"
description = "Proyecto Integrador 1"
readme = "README.md"
license = { text = "Not open source" }

authors = [
  { name = "Antoni Montenegro", email = "tonileo2154@gmail.com" },
]

requires-python = ">=3.12,<3.13"

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.9",
  "django==6.1.1",
  "django-allauth[mfa]==65.19.3",
  "django-anymail==15.2",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-filter==25.1",
  "django-model-utils==5.0.0",
  "openpyxl==3.1.5",
  "django-redis==6.0.0",
  "djangorestframework==3.18.1",
  "djangorestframework-simplejwt==5.5.1",
  "PyJWT==2.13.0",
  "drf-spectacular==0.30.0",
  "gunicorn==25.3.0",
  "hiredis==3.4.1",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.5",
  "psutil==7.2.2",
  "django-auditlog==3.4.1",
  "python-slugify==8.0.4",
  "redis==7.4.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.1",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==6.3.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.0",
  "djangorestframework-stubs==3.18.1",
  "djlint==1.46.1",
  "factory-boy==3.3.3",
  "import-linter==2.15",
  "ipdb==0.13.13",
  "mypy==1.20.2",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.7",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.8",
]

[tool.ruff]
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]

lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]

lint.ignore = [
  "RUF012",
  "S101",
  "SIM102",
]

lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"

python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====

[tool.coverage.run]
include = [ "memos_cafe/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]

# ==== mypy ====

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====

[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

# ==== Pyrefly ====
# Pyrefly es un linter externo de VS Code. El type checker oficial del proyecto
# es mypy con mypy-drf-plugin (ver sección [tool.mypy] arriba).
# Los errores bad-override en clases Meta de DRF son falsos positivos:
# SerializerMetaclass procesa Meta en tiempo de ejecución de una forma que
# Pyrefly no puede inferir estáticamente. Se deshabilitan aquí para evitar
# contaminar los archivos con comentarios # pyrefly: ignore.
[tool.pyrefly]
errors_to_ignore = ["bad-override"]
