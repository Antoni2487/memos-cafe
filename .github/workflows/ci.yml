name: CI

on:
  pull_request:
    branches: ['main', 'develop']
    paths-ignore: ['docs/**']

  push:
    branches: ['main', 'develop']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      # Solo se revisan los archivos que cambian en el PR/push: el codigo
      # existente todavia no pasa todos los hooks (ruff, djlint, etc.) y se
      # va limpiando a medida que se toca, sin bloquear el CI.
      - name: Run pre-commit (archivos cambiados)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: >-
            --from-ref ${{ github.event.pull_request.base.sha || github.event.before }}
            --to-ref ${{ github.sha }}

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memos_cafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/memos_cafe
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Check DB Migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Contratos de arquitectura (import-linter)
        run: uv run lint-imports

      - name: Run Django Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # `npm run build` = `tsc -b && vite build`: falla ante cualquier error
      # de tipos o de compilacion.
      - name: Typecheck y build
        run: npm run build
